.progressCircle{background:conic-gradient(var(--accent) var(--angle),var(--paper2) 0);border:1px solid var(--line);width:119px;height:119px}.progressCircle:before{background:var(--paper)}.progressCircle strong{font:normal 29px Georgia,serif}.statLine strong{color:var(--accentDeep)}.mood{border-radius:6px;min-width:0;flex:1;padding:6px 2px}.mood.active{border:1px solid var(--ornament);background:var(--accentLight)}.field{border-radius:6px;border-color:var(--line);background:var(--paper);color:var(--ink)}.field::placeholder{color:#9c9a90}.addTask .btn{white-space:nowrap}.taskrow{border-bottom:1px solid var(--line)}.taskrow input[type=checkbox]{accent-color:var(--accent)}.miniQuote{border-radius:7px;background:linear-gradient(115deg,var(--accentLight),var(--paper2));border:1px solid var(--line);color:var(--accentDeep);font:italic 17px Georgia,serif;position:relative;padding-left:26px}.miniQuote:before{content:"✧";position:absolute;left:10px;top:12px;font-style:normal;color:var(--ornament)}.monthDay{border-radius:5px;min-height:76px}.monthDay.selected{border:2px solid var(--ornament)}.monthDay .meter{background:var(--paper2)}.monthDay .meter span{background:var(--accent)}.metric b{font-family:Georgia,serif;font-weight:normal}.barSlot span{background:var(--accent)}.lineTrack>div{background:var(--accent)}.summaryGrid .card{background:var(--paper)}

<body>
<div class="layout">
<aside class="sidebar">
 <div class="logo"><div class="logoMark">✧</div><div><b>Daybloom</b><small>ADVENTURER'S JOURNAL</small></div></div>
 <nav id="desktopNav" class="nav" aria-label="Main navigation"></nav>
 <div class="sidebarEnd"><span class="offline">Offline • Your own world</span><strong style="margin-top:8px">Ad astra abyssosque.</strong><p>Your personal journal, free from monthly fees. An adventure at your own pace.</p></div>
</aside>
<main class="shell"><div id="topbar" class="top"></div><div id="content"></div></main>
</div>
<nav id="mobileNav" class="mobileNav" aria-label="Mobile navigation"></nav>
<dialog id="habitDialog"><div class="dialogInner"><div class="dialogHeader"><h2 id="dialogTitle">New commission</h2><button class="iconBtn" type="button" id="closeDialog" aria-label="Close">✕</button></div>
<form id="habitForm">
<input type="hidden" name="id" />
<div class="formGrid"><div class="formrow"><label class="fieldlabel" for="habitEmoji">Emoji</label><input id="habitEmoji" class="field" name="emoji" maxlength="4" value="🌱" required /></div><div class="formrow"><label class="fieldlabel" for="habitCategory">Category</label><select id="habitCategory" class="field" name="category"><option>Wellbeing</option><option>Productivity</option><option>Learning</option><option>Home</option><option>Creativity</option><option>Other</option></select></div></div>
<div class="formrow"><label class="fieldlabel" for="habitName">Habit name</label><input id="habitName" class="field" name="title" placeholder="e.g. Read for ten minutes" maxlength="85" required /></div>
<div class="formGrid"><div class="formrow"><label class="fieldlabel" for="habitAnchor">When will you do it?</label><select id="habitAnchor" class="field" name="anchor"><option>After waking</option><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Before bed</option><option>Anytime</option></select></div><div class="formrow"><label class="fieldlabel" for="habitTime">Optional time</label><input id="habitTime" class="field" name="time" type="time" /></div></div>
<div class="formrow"><label class="fieldlabel" for="habitRepeat">Repeat</label><select id="habitRepeat" class="field" name="repeat"><option value="daily">Every day</option><option value="custom">Selected weekdays</option></select></div>
<div id="daySelectArea" class="formrow" hidden><label class="fieldlabel">Choose days</label><div class="daysSelect" id="daySelect"></div></div>
<div class="formrow"><label class="fieldlabel" for="habitDesc">Gentle reminder (optional)</label><input id="habitDesc" class="field" name="desc" maxlength="140" placeholder="Start small. Showing up is enough." /></div>
<div class="dialogFooter"><button type="button" class="btn warning" id="deleteHabit" hidden>Delete habit</button><div style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn secondary" id="cancelDialog">Cancel</button><button type="submit" class="btn">Save habit</button></div></div>
</form></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none" />
<script>

(()=>{'use strict';
const KEY='daybloom.data.v1';
const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ANCHORS=['After waking','Morning','Afternoon','Evening','Before bed','Anytime'];
const NAV=[['today','✦','Commissions'],['calendar','▦','Calendar'],['insights','◇','Progress'],['journal','✎','Journal'],['settings','⚙','Settings']];
const MOODS=[['😣','Rough'],['😕','Low'],['😐','Okay'],['🙂','Good'],['🥰','Lovely']];
const seed=()=>({version:1,habits:[
{id:'h_water',title:'Drink a glass of water',emoji:'💧',category:'Wellbeing',anchor:'After waking',time:'',repeat:'daily',days:[0,1,2,3,4,5,6],desc:'Start with one sip.',created:'2020-01-01'},
{id:'h_stretch',title:'Stretch for five minutes',emoji:'🌿',category:'Wellbeing',anchor:'Morning',time:'',repeat:'daily',days:[0,1,2,3,4,5,6],desc:'Move at your own pace.',created:'2020-01-01'},
{id:'h_focus',title:'A little focused time',emoji:'📚',category:'Learning',anchor:'Afternoon',time:'',repeat:'custom',days:[1,2,3,4,5],desc:'Even ten minutes makes a difference.',created:'2020-01-01'},
{id:'h_wind',title:'Make time to unwind',emoji:'🌙',category:'Wellbeing',anchor:'Before bed',time:'',repeat:'daily',days:[0,1,2,3,4,5,6],desc:'Rest is productive too.',created:'2020-01-01'}],logs:{},rests:{},moods:{},journals:{},tasks:[],theme:'light',region:'mondstadt',companion:'albedo',travelerName:'Traveler'});
function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.habits)&&typeof o.logs==='object'&&o.logs!==null){return {...seed(),...o,rests:o.rests||{},moods:o.moods||{},journals:o.journals||{},tasks:Array.isArray(o.tasks)?o.tasks:[]}}}catch(e){}return seed()}
let data=load(),tab='today',selected=stamp(new Date()),calendarAt=new Date(),toastTimer;

const COMPANIONS={albedo:{name:'Albedo',title:'Chief Alchemist',quote:'Every discovery begins with curiosity.',art:'./assets/albedo.webp'},zhongli:{name:'Zhongli',title:'Wangsheng Consultant',quote:'There is no need to rush the journey.',art:'./assets/zhongli.webp'},nahida:{name:'Nahida',title:'Lesser Lord Kusanali',quote:'Each small step is a seed of possibility.',art:'./assets/nahida.webp'}};
const REGIONS={mondstadt:{name:'Mondstadt',glyph:'✦'},liyue:{name:'Liyue',glyph:'◇'},sumeru:{name:'Sumeru',glyph:'❀'}};
function getCompanion(){return COMPANIONS[data.companion]||COMPANIONS.albedo}
function getRegion(){return REGIONS[data.region]||REGIONS.mondstadt}
function adventure(){let points=Object.values(data.logs).filter(Boolean).length*20+data.tasks.filter(t=>t.done).length*10;return {points,rank:Math.floor(points/120)+1,toNext:points%120,percentage:Math.round((points%120)/120*100)}}

function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){showToast('Could not save locally. Please export a backup.')}}
function stamp(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parse(s){let a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function offset(s,n){let d=parse(s);d.setDate(d.getDate()+n);return stamp(d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function due(h,d){if(h.created && d<h.created)return false;return h.repeat!=='custom'||(Array.isArray(h.days)&&h.days.includes(parse(d).getDay()))}
function key(d,h){return d+'|'+h}
function done(h,d=selected){return !!data.logs[key(d,h.id)]}
function rest(h,d=selected){return !!data.rests[key(d,h.id)]}
function todayRate(d){let dueHabits=data.habits.filter(h=>due(h,d)&&!rest(h,d)),finished=dueHabits.filter(h=>done(h,d)).length;return {total:dueHabits.length,done:finished,percent:dueHabits.length?Math.round(finished/dueHabits.length*100):0,rest:data.habits.filter(h=>due(h,d)&&rest(h,d)).length}}
function streak(h){let d=stamp(new Date()),count=0,started=false;for(let i=0;i<366;i++){if(d<(h.created||'2020-01-01'))break;if(due(h,d)){if(rest(h,d)){}else if(done(h,d)){count++;started=true}else if(!(i===0&&!started))break;}d=offset(d,-1)}return count}
function format(d,opts){return new Intl.DateTimeFormat('en-US',opts).format(parse(d))}
function timeText(t){if(!t)return '';let [hh,mm]=t.split(':').map(Number);return (hh%12||12)+':'+String(mm).padStart(2,'0')+' '+(hh>=12?'PM':'AM')}
function showToast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function setTab(v){tab=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function navigate(d){selected=d;calendarAt=parse(d);render()}
function renderNav(){for(let dest of ['desktopNav','mobileNav']){document.getElementById(dest).innerHTML=NAV.map(([t,ico,name])=>`<button data-tab="${t}" class="${t===tab?'active':''}" ${t===tab?'aria-current="page"':''}><span class="ico">${ico}</span><span>${name}</span></button>`).join('')}}
function renderTop(){let labels={today:['✧ Adventurer’s handbook','Daily Commissions'],calendar:['✧ Your journey through Teyvat','Adventure Calendar'],insights:['✧ Adventurer’s achievements','Adventure Progress'],journal:['✧ The travel journal','Your Chronicles'],settings:['✧ Adventurer’s guild desk','Customize Your World']};let a=labels[tab],adv=adventure();document.getElementById('topbar').innerHTML=`<div><span class="eyebrow">${a[0]} · ${getRegion().name}</span><h1>${a[1]} <span class="flourish">✧</span></h1></div><div class="topActions"><div class="rankChip" title="Earn 20 EXP per habit completed and 10 per side quest"><span>AR</span><strong>${adv.rank}</strong></div><button class="round" data-tab="settings" title="Settings" aria-label="Settings">⚙</button><button class="btn" id="newHabit" aria-label="Create habit">＋ <span class="long">New quest</span></button></div>`}
function render(){document.body.classList.toggle('dark',data.theme==='dark');for(let n of Object.keys(REGIONS))document.body.classList.toggle('region-'+n,(data.region||'mondstadt')===n);renderNav();renderTop();let el=document.getElementById('content');el.innerHTML=({today:renderToday,calendar:renderCalendar,insights:renderInsights,journal:renderJournal,settings:renderSettings}[tab])()+`<div class="pageFoot">✦ Daybloom · A little adventure, every day · ✦</div>`}
function weekStrip(){let ref=parse(selected),day=ref.getDay();let monday=offset(selected,-((day+6)%7));return `<div class="dateJump"><strong>${format(selected,{month:'long',year:'numeric'})}</strong><div class="dateControls"><button data-day="${offset(selected,-7)}" title="Previous week">‹</button><button data-day="${stamp(new Date())}" title="Jump to today">⌾</button><button data-day="${offset(selected,7)}" title="Next week">›</button></div></div><div class="weekstrip">${Array.from({length:7},(_,i)=>{let d=offset(monday,i);let r=todayRate(d);return `<button data-day="${d}" class="daychip ${selected===d?'active':''}" ${selected===d?'aria-current="date"':''}><small>${DAY_NAMES[parse(d).getDay()]}</small><strong>${parse(d).getDate()}</strong><span class="dot" style="opacity:${r.done?1:0.16}"></span></button>`}).join('')}</div>`}
function habitMarkup(h){let complete=done(h),rested=rest(h);return `<article class="habit ${complete?'done':''} ${rested?'rested':''}"><div class="emojiBox">${esc(h.emoji||'🌱')}</div><div class="habitText"><div class="habitTitle">${esc(h.title)}</div><div class="habitMeta">${esc(h.category||'Habit')}${h.time?' · '+timeText(h.time):''}${rested?' · Rest day':''}</div></div><button class="iconBtn" data-rest="${h.id}" title="${rested?'Remove rest day':'Take a rest day'}" aria-label="${rested?'Remove rest day':'Mark rest day'} for ${esc(h.title)}">${rested?'♧':'☾'}</button><button class="iconBtn" data-edit="${h.id}" aria-label="Edit ${esc(h.title)}">⋯</button><button class="check" data-check="${h.id}" ${rested?'disabled':''} aria-label="${complete?'Mark incomplete':'Complete'} ${esc(h.title)}">${complete?'✓':''}</button></article>`}
function groupedHabits(){let dueList=data.habits.filter(h=>due(h,selected));if(!dueList.length)return `<div class="empty"><div class="big">🌱</div><h3>No commissions posted</h3><p>No habits are scheduled for this day. Add a new one, or choose another date.</p><button class="btn" id="emptyAdd">Accept a quest</button></div>`;return ANCHORS.map(a=>{let items=dueList.filter(h=>h.anchor===a).sort((x,y)=>(x.time||'').localeCompare(y.time||''));return items.length?`<section class="habitGroup"><h3 class="groupLabel"><span>${({'After waking':'🌤','Morning':'☀️','Afternoon':'🌿','Evening':'🌆','Before bed':'🌙','Anytime':'✦'})[a]}</span>${a} <span class="pill">${items.filter(h=>done(h)).length}/${items.filter(h=>!rest(h)).length}</span></h3>${items.map(habitMarkup).join('')}</section>`:''}).join('')}
function taskHTML(){let tasks=data.tasks.filter(t=>t.date===selected);return `<section class="card"><div class="sectionTitle"><div><div class="questSub">✦ Optional adventures</div><h2>Side quests</h2></div><small>${tasks.filter(t=>t.done).length}/${tasks.length} cleared</small></div>${tasks.length?tasks.map(t=>`<div class="taskrow"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''} aria-label="Complete ${esc(t.text)}"><span class="${t.done?'cross':''}">${esc(t.text)}</span><button data-delete-task="${t.id}" class="iconBtn" aria-label="Delete task">×</button></div>`).join(''):`<div class="tiny">Got a little errand or mini-quest? Add it below.</div>`}<form class="addTask" id="taskForm"><input class="field" name="task" maxlength="140" placeholder="Add a side quest..." aria-label="Add task" required><button class="btn" type="submit">Add</button></form></section>`}
function moodWidget(d=selected){return `<div class="moodRow">${MOODS.map(([icon,name],i)=>`<button data-mood="${i+1}" data-mood-date="${d}" class="mood ${data.moods[d]===i+1?'active':''}" aria-label="Mood: ${name}" title="${name}">${icon}<small>${name}</small></button>`).join('')}</div>`}
function overview(){let r=todayRate(selected),adv=adventure();return `<section class="card"><div class="sectionTitle"><h2>Commission rewards</h2><span class="pill">✦ ${format(selected,{month:'short',day:'numeric'})}</span></div><div class="progressCircle" style="--angle:${r.percent}%"><div><strong>${r.percent}%</strong><small>complete</small></div></div><div class="statLine"><span class="muted">Commissions finished</span><strong>${r.done} / ${r.total}</strong></div><div class="statLine"><span class="muted">Rest days taken</span><strong>${r.rest}</strong></div><div class="statLine"><span class="muted">Adventure EXP earned</span><strong>✦ ${adv.points} EXP</strong></div><div class="questTrack" style="margin-top:13px"><span style="width:${adv.percentage}%"></span></div><div class="hint">${120-adv.toNext} EXP until Adventure Rank ${adv.rank+1}. Rest days don't count against your goals.</div></section>`}
function renderToday(){let person=getCompanion(),region=getRegion();return `<div class="split"><div class="stack"><section class="welcome"><span class="heroDecor" aria-hidden="true"></span><span class="bannerCorner">✧ ◇ ✧</span><div class="heroCopy"><div class="small">✦ ${esc(region.name)} · Your adventurer's handbook</div><h2>${format(selected,{weekday:'long',month:'short',day:'numeric'})}</h2><p>${esc(person.quote)}<br>Take on the day, one little quest at a time.</p><div class="heroFooter"><span class="heroTag">Hello, ${esc(data.travelerName||'Traveler')}</span><span class="heroCompanion">✧ ${esc(person.name)}</span></div></div><img class="heroCharacter" src="${person.art}" alt="${esc(person.name)} artwork"><img class="heroPaimon" src="./assets/paimon.webp" alt="Paimon" onerror="this.style.display='none'"></section>${weekStrip()}<div><div class="sectionTitle"><div><div class="questSub">✦ Commission board</div><h2 class="questHeading"><img src="./assets/quest.webp" alt="">Daily commissions</h2></div><small>${data.habits.filter(h=>due(h,selected)).length} available</small></div>${groupedHabits()}<button class="btn secondary" id="addHabitInline" style="width:100%">＋ Accept a new commission</button></div>${taskHTML()}</div><aside class="stack secondaryColumn">${overview()}<section class="card"><div class="sectionTitle"><h2>Today's element</h2><span>✧</span></div><div class="tiny">Every feeling belongs on your journey.</div>${moodWidget()}</section><section class="card"><div class="sectionTitle"><h2>Traveler's notes</h2><button class="iconBtn" data-tab="journal" aria-label="Open journal">↗</button></div><textarea class="field" data-journal="${selected}" placeholder="A little story from today's adventure..." aria-label="Today's journal entry">${esc(data.journals[selected]||'')}</textarea><p class="hint">Your thoughts are saved on this device.</p></section><div class="miniQuote">There is no deadline for becoming who you wish to be.</div></aside></div>`}
function renderCalendar(){let year=calendarAt.getFullYear(),month=calendarAt.getMonth();let first=new Date(year,month,1);let start=first.getDay(),days=new Date(year,month+1,0).getDate(),n=Math.ceil((start+days)/7)*7;let cells=Array.from({length:n},(_,i)=>{let d=new Date(year,month,1-start+i,12),s=stamp(d),r=todayRate(s),curr=d.getMonth()===month;return `<button class="monthDay ${curr?'':'out'} ${s===selected?'selected':''}" data-calendar-day="${s}" title="${s}: ${r.done}/${r.total} habits"><span class="number">${d.getDate()}${data.moods[s]?` <span style="font-size:10px">${MOODS[data.moods[s]-1][0]}</span>`:''}</span><span class="meter"><span style="width:${r.percent}%"></span></span></button>`}).join('');return `<div class="stack"><div class="card"><div class="monthHeader"><div><h2>${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</h2><div class="tiny">Your month, one day at a time.</div></div><div class="dateControls"><button data-month="-1" aria-label="Previous month">‹</button><button data-month="0" aria-label="Current month">⌾</button><button data-month="1" aria-label="Next month">›</button></div></div><div class="monthGrid">${DAY_NAMES.map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><p class="hint">The green bars show your completion rate. Tap any day to see and edit its routine.</p></div><div class="card"><div class="sectionTitle"><h2>${format(selected,{weekday:'long',month:'long',day:'numeric'})}</h2><button class="btn secondary" data-tab="today">Open day →</button></div>${overviewMini(selected)}</div></div>`}
function overviewMini(d){let a=data.habits.filter(h=>due(h,d));return a.length?a.map(h=>`<div class="taskrow"><span>${esc(h.emoji)} ${esc(h.title)}</span><span class="pill">${rest(h,d)?'Rest':done(h,d)?'Done':'Not yet'}</span></div>`).join(''):'<p class="tiny">No scheduled habits today.</p>'}
function renderInsights(){let last30=Array.from({length:30},(_,i)=>offset(stamp(new Date()),i-29));let rates=last30.map(todayRate);let total=rates.reduce((s,x)=>s+x.total,0),doneCount=rates.reduce((s,x)=>s+x.done,0),rate=total?Math.round(doneCount/total*100):0;let best=Math.max(0,...data.habits.map(streak));let week=last30.slice(-7);let dayBar=week.map(d=>{let r=todayRate(d);return `<div class="barSlot" title="${d}: ${r.percent}%"><span style="height:${Math.max(r.percent,2)}%"></span><small>${DAY_NAMES[parse(d).getDay()]}</small></div>`}).join('');let habits=data.habits.map(h=>{let days=last30.filter(d=>due(h,d)&&!rest(h,d));let count=days.filter(d=>done(h,d)).length;let p=days.length?Math.round(count/days.length*100):0;return `<div class="habitProgress"><div class="head"><span>${esc(h.emoji)} <strong>${esc(h.title)}</strong></span><span class="muted">${p}% · 🔥 ${streak(h)}</span></div><div class="lineTrack"><div style="width:${p}%"></div></div></div>`}).join('');return `<div class="stack"><div class="summaryGrid"><div class="card metric"><span class="tiny">30-day consistency</span><b>${rate}%</b></div><div class="card metric"><span class="tiny">Habits completed</span><b>${doneCount}</b></div><div class="card metric"><span class="tiny">Best current streak</span><b>${best} <span style="font-size:15px">days</span></b></div></div><div class="split"><section class="card"><div class="sectionTitle"><h2>Last seven days</h2><small>Daily completion</small></div><div class="barChart">${dayBar}</div><p class="hint" style="margin-top:28px">A gentle overview. Rest days don't count against completion percentages.</p></section><section class="card"><div class="sectionTitle"><h2>Commission records</h2><span>🌷</span></div>${habits||'<div class="tiny">Add a habit to start growing your garden.</div>'}</section></div><section class="card"><div class="sectionTitle"><h2>30-day adventure</h2><small>Tap a day in Calendar to review it.</small></div><div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px">${last30.map(d=>{let r=todayRate(d);return `<div title="${d}: ${r.percent}%" style="height:28px;border-radius:7px;background:${r.percent>=100?'var(--green-dark)':r.percent>=50?'var(--mint)':r.percent>0?'var(--gold)':'var(--paper2)'}"></div>`}).join('')}</div></section></div>`}
function renderJournal(){let entries=Object.keys(data.journals).filter(d=>data.journals[d]&&data.journals[d].trim()).sort().reverse().slice(0,15);return `<div class="split"><div class="stack"><section class="card"><div class="sectionTitle"><h2>Today, in your own words</h2><span class="pill">${format(selected,{month:'short',day:'numeric'})}</span></div><div class="dateControls" style="margin-bottom:13px"><button data-day="${offset(selected,-1)}" aria-label="Previous day">‹</button><button data-day="${stamp(new Date())}" aria-label="Today">⌾</button><button data-day="${offset(selected,1)}" aria-label="Next day">›</button></div><label class="fieldlabel">What was your day like?</label><textarea data-journal="${selected}" class="field" style="min-height:245px" placeholder="Something good, something difficult, a tiny victory...">${esc(data.journals[selected]||'')}</textarea><div class="hint">Your entries are saved automatically, without an account.</div></section><section class="card"><h2 class="headline">Past reflections</h2><div class="journalHistory spaced">${entries.length?entries.map(d=>`<div class="entry"><div style="display:flex;justify-content:space-between;align-items:center"><strong>${format(d,{month:'short',day:'numeric',year:'numeric'})} ${data.moods[d]?MOODS[data.moods[d]-1][0]:''}</strong><button class="iconBtn" data-day="${d}" title="Open entry">↗</button></div><p>${esc(data.journals[d])}</p></div>`).join(''):'<p class="tiny">Your reflections will appear here as your days unfold.</p>'}</div></section></div><aside class="stack"><section class="card"><div class="sectionTitle"><h2>Mood check-in</h2><span>☁️</span></div>${moodWidget()}<p class="hint">You can change your mood rating anytime.</p></section><div class="miniQuote">One sentence is enough to remember a day. ✨</div></aside></div>`}
function renderSettings(){return `<div class="stack"><section class="card"><div class="sectionTitle"><h2>Adventurer's identity</h2><span class="pill">Personal edition</span></div><label class="fieldlabel" for="travelerName">What should we call you?</label><input id="travelerName" class="field" maxlength="32" value="${esc(data.travelerName||'Traveler')}" placeholder="Traveler"/><p class="hint">Your name appears on your daily commission banner.</p></section><section class="card"><div class="sectionTitle"><h2>Travel companion</h2><span class="pill">Choose your guide</span></div><p class="tiny">Choose which friend appears in your journal. Artwork from your Drive collection.</p><div class="customizer">${Object.entries(COMPANIONS).map(([k,c])=>`<button class="choice ${data.companion===k?'active':''}" data-companion="${k}" aria-pressed="${data.companion===k}"><img src="${c.art}" alt=""><strong>${c.name}</strong></button>`).join('')}</div></section><section class="card"><div class="sectionTitle"><h2>Where shall we adventure?</h2><span class="pill">Region palette</span></div><div class="customizer regionChoices">${Object.entries(REGIONS).map(([k,r])=>`<button class="choice ${data.region===k?'active':''}" data-region="${k}" aria-pressed="${data.region===k}"><span class="regionalIcon">${r.glyph}</span><strong>${r.name}</strong></button>`).join('')}</div></section><section class="card"><div class="sectionTitle"><h2>Guild services</h2><span class="pill">No subscription</span></div><div class="settingRow"><div><strong>Evening mode</strong><p>Use a midnight-blue menu and darker parchment.</p></div><button id="themeToggle" class="btn secondary">${data.theme==='dark'?'☀ Light mode':'☾ Dark mode'}</button></div><div class="settingRow"><div><strong>Back up your progress</strong><p>Export habits, completion history, tasks, moods, settings and notes.</p></div><button class="btn secondary" id="exportData">↓ Export</button></div><div class="settingRow"><div><strong>Restore a backup</strong><p>Import any compatible Daybloom backup. It replaces local data.</p></div><button class="btn secondary" id="importData">↑ Import</button></div><div class="settingRow"><div><strong>Start a new adventure</strong><p>Clear your local progress after confirmation.</p></div><button class="btn warning" id="resetData">Reset</button></div></section><section class="card"><h2 style="font:normal 20px Georgia,serif;margin:0 0 10px">Your journal stays yours</h2><p class="note">Daybloom runs without an account or subscription. Your entries are stored locally in your browser on this device, not uploaded to a server. Back up your progress occasionally, as browser data can be cleared.</p><p class="note">The hosted PWA version can be installed to your home screen and used offline after first loading over HTTPS. This edition does not include push reminders, widgets or device syncing.</p><span class="offline">Free forever. A private, fan-inspired personal planner.</span></section></div>`}
function openHabit(idValue){let dlg=document.getElementById('habitDialog'),form=document.getElementById('habitForm');form.reset();let h=data.habits.find(x=>x.id===idValue);document.getElementById('dialogTitle').textContent=h?'Edit habit':'New commission';form.elements.id.value=h?.id||'';form.elements.emoji.value=h?.emoji||'🌱';form.elements.title.value=h?.title||'';form.elements.category.value=h?.category||'Wellbeing';form.elements.anchor.value=h?.anchor||'After waking';form.elements.time.value=h?.time||'';form.elements.repeat.value=h?.repeat||'daily';form.elements.desc.value=h?.desc||'';document.getElementById('deleteHabit').hidden=!h;renderDays(h?.days||[1,2,3,4,5]);document.getElementById('daySelectArea').hidden=form.elements.repeat.value!=='custom';dlg.showModal();setTimeout(()=>form.elements.title.focus(),70)}
function renderDays(a){document.getElementById('daySelect').innerHTML=DAY_NAMES.map((n,i)=>`<label class="dayToggle"><input type="checkbox" name="weekday" value="${i}" ${a.includes(i)?'checked':''}><span>${n.slice(0,2)}</span></label>`).join('')}
function closeHabit(){document.getElementById('habitDialog').close()}
document.getElementById('habitForm').addEventListener('submit',e=>{e.preventDefault();let f=e.currentTarget;let days=Array.from(f.querySelectorAll('[name="weekday"]:checked')).map(x=>Number(x.value));if(f.elements.repeat.value==='custom'&&!days.length){showToast('Choose at least one day.');return}let obj={id:f.elements.id.value||id(),emoji:f.elements.emoji.value.trim()||'🌱',title:f.elements.title.value.trim(),category:f.elements.category.value,anchor:f.elements.anchor.value,time:f.elements.time.value,repeat:f.elements.repeat.value,days:f.elements.repeat.value==='daily'?[0,1,2,3,4,5,6]:days,desc:f.elements.desc.value.trim(),created:f.elements.id.value?(data.habits.find(x=>x.id===f.elements.id.value)?.created||selected):selected};if(!obj.title){showToast('Give your habit a name.');return}let i=data.habits.findIndex(x=>x.id===obj.id);if(i<0)data.habits.push(obj);else data.habits[i]=obj;save();closeHabit();render();showToast(i<0?'New commission accepted! ✦':'Commission updated.')});
document.getElementById('habitForm').elements.repeat.addEventListener('change',e=>{document.getElementById('daySelectArea').hidden=e.target.value!=='custom'});
document.getElementById('closeDialog').addEventListener('click',closeHabit);document.getElementById('cancelDialog').addEventListener('click',closeHabit);
document.getElementById('deleteHabit').addEventListener('click',()=>{let f=document.getElementById('habitForm'),hid=f.elements.id.value;if(!hid||!confirm('Delete this habit and its history?'))return;data.habits=data.habits.filter(h=>h.id!==hid);for(let o of [data.logs,data.rests])for(let k of Object.keys(o))if(k.endsWith('|'+hid))delete o[k];save();closeHabit();render();showToast('Commission removed.')});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.companion){if(!COMPANIONS[b.dataset.companion])return;data.companion=b.dataset.companion;save();render();showToast('Companion changed! ✦');return}if(b.dataset.region){if(!REGIONS[b.dataset.region])return;data.region=b.dataset.region;save();render();showToast('Region changed! ✦');return}if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.day){navigate(b.dataset.day);return}if(b.dataset.calendarDay){navigate(b.dataset.calendarDay);setTab('today');return}if(b.dataset.month){let v=Number(b.dataset.month);if(v===0)calendarAt=new Date();else calendarAt=new Date(calendarAt.getFullYear(),calendarAt.getMonth()+v,1);render();return}if(b.dataset.check){let h=data.habits.find(x=>x.id===b.dataset.check);if(!h)return;let k=key(selected,h.id);data.logs[k]=!data.logs[k];if(!data.logs[k])delete data.logs[k];save();render();return}if(b.dataset.rest){let h=data.habits.find(x=>x.id===b.dataset.rest);if(!h)return;let k=key(selected,h.id);data.rests[k]=!data.rests[k];if(data.rests[k])delete data.logs[k];else delete data.rests[k];save();render();showToast(data.rests[k]?'Rest day recorded. Take care. 🌙':'Habit is active again.');return}if(b.dataset.edit){openHabit(b.dataset.edit);return}if(b.dataset.mood){data.moods[b.dataset.moodDate]=Number(b.dataset.mood);save();render();showToast('Mood saved. ♡');return}if(b.dataset.deleteTask){data.tasks=data.tasks.filter(t=>t.id!==b.dataset.deleteTask);save();render();return}if(['newHabit','emptyAdd','addHabitInline','settingsAdd'].includes(b.id)){openHabit();return}if(b.id==='themeToggle'){data.theme=data.theme==='dark'?'light':'dark';save();render();return}if(b.id==='exportData'){downloadBackup();return}if(b.id==='importData'){document.getElementById('importFile').click();return}if(b.id==='resetData'){if(confirm('This will permanently erase all your habits, tasks, moods and journal entries from this device. Continue?')){data=seed();save();tab='today';selected=stamp(new Date());render();showToast('Fresh start created.')}}});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='travelerName'){data.travelerName=el.value.trim().slice(0,32)||'Traveler';save();showToast('Adventurer name saved.');return}if(el.matches('[data-task]')){let x=data.tasks.find(t=>t.id===el.dataset.task);if(x){x.done=el.checked;save();render()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();let input=e.target.elements.task;let v=input.value.trim();if(!v)return;data.tasks.push({id:id(),date:selected,text:v,done:false});save();render();showToast('Task added. ✨')});
document.addEventListener('input',e=>{if(e.target.matches('[data-journal]')){data.journals[e.target.dataset.journal]=e.target.value;save()}});
function downloadBackup(){let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daybloom-backup-'+stamp(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);showToast('Backup saved. Keep it somewhere safe!')}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.habits)||!o.logs||typeof o.logs!=='object'||!o.tasks||!Array.isArray(o.tasks)||!o.journals||typeof o.journals!=='object')throw Error('Invalid file');if(!confirm('Replace your current data with this backup?'))return;data={...seed(),...o,theme:o.theme==='dark'?'dark':'light',companion:COMPANIONS[o.companion]?o.companion:'albedo',region:REGIONS[o.region]?o.region:'mondstadt',travelerName:String(o.travelerName||'Traveler').slice(0,32)};save();render();showToast('Backup restored successfully!')}catch(err){showToast('That does not look like a valid Daybloom backup.')}finally{e.target.value=''}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();

</script>
</body>
